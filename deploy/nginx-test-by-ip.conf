# Stage 1 — testing by IP address. The website at http://<container-IP>/,
# Strapi directly at http://<container-IP>:1337/admin.
# Install: see docs/DEPLOY-PROXMOX.md, step 7.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/sherubtse;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # “Ask Sherubtse” AI chat server (chat-server/)
    location = /api/chat {
        proxy_pass http://127.0.0.1:4600;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 32k;
    }
}
