# Stage 2 — real addresses. Replace both names below if you use different ones,
# then run certbot to add HTTPS (docs/DEPLOY-PROXMOX.md, step 12).

# The public website
server {
    listen 80;
    server_name new.sherubtse.edu.bt;

    root /var/www/sherubtse;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # “Ask Sherubtse” AI chat server (chat-server/)
    location = /api/chat {
        proxy_pass http://127.0.0.1:4600;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 32k;
    }
}

# Strapi: admin panel, API and uploaded photos
server {
    listen 80;
    server_name cms.sherubtse.edu.bt;

    client_max_body_size 50m; # photo and PDF uploads

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
